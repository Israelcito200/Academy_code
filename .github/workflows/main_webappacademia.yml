name: Deploy Node site to Azure Web App - WebAppacademia

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install   # <-- instala express y demás

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-site
          path: .   # raíz del repo

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-site
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4E634BA98CD441C0ABA667579E85B28C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B9AEB8C00B064AD59C9C07B6D50D19B7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_0242BD7E62074B93BB30A6F5CD9921D6 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'WebAppacademia'
          slot-name: 'Production'
          package: .
