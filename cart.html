<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inscripción — Academia Código</title>
  </head>
  <body>
    <header><a href="index.html">Inicio</a></header>
    <main>
      <h1>Formulario de inscripción</h1>
      <p>Puedes reservar tu plaza completando el formulario simple:</p>
      <form action="#" method="post">
        <label for="name">Nombre</label><br>
        <input id="name" name="name" required><br>
        <label for="email">Correo</label><br>
        <input id="email" name="email" type="email" required><br>
        <button type="submit">Reservar plaza</button>
      </form>
    </main>
    <footer><a href="index.html">Volver</a></footer>
  </body>
